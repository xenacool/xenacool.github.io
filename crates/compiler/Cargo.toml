[package]
name = "pystral_compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
pystral_core = { path = "../core" }
hexx = { version = "0.24.0", features = ["grid", "serde", "mesh"] }
glam = { version = "0.30", features = ["serde"] }
constraint-solver = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
rapier3d = "0.34.0"
bincode = "1.3"
byteorder = "1.5"
[lints]
workspace = true
