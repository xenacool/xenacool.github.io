[package]
name = "pystral_games"
version = "0.1.0"
edition = "2024"

[dependencies]
pystral_core = { path = "../core" }
npc-engine-core = { git = "https://github.com/xenacool/npc-engine.git" }
npc-engine-utils = { git = "https://github.com/xenacool/npc-engine.git" }
serde = { version = "1.0", features = ["derive"] }
hexx = { version = "0.24.0", features = ["grid", "serde", "mesh"] }
rand = "0.8"
rand_core = "0.6"

[lints]
workspace = true
