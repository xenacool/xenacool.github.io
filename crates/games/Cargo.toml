[package]
name = "pystral_games"
version = "0.1.0"
edition = "2024"

[dependencies]
pystral_core = { path = "../core" }
pystral_physics = { path = "../physics" }
npc-engine-core = { git = "https://github.com/xenacool/npc-engine.git" }
npc-engine-utils = { git = "https://github.com/xenacool/npc-engine.git" }
serde = { version = "1.0", features = ["derive"] }
hexx = { version = "0.24.0", features = ["grid", "serde", "mesh"] }
rand = "0.8"
rand_core = "0.6"
rapier3d = "0.34.0"
glam = { version = "0.30", features = ["serde"] }
[lints]
workspace = true

[dev-dependencies]
proptest = "1.0"
