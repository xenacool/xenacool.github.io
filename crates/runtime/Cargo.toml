[package]
name = "pystral_runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
pystral_core = { path = "../core" }
pystral_compiler = { path = "../compiler" }
pystral_games = { path = "../games" }
pystral_macros = { path = "../macros" }
npc-engine-core = { git = "https://github.com/xenacool/npc-engine.git" }
serde = { version = "1.0", features = ["derive"] }
glam = { version = "0.30", features = ["serde"] }
hexx = { version = "0.24.0", features = ["grid", "serde", "mesh"] }
wasm-bindgen = "0.2"
log = "0.4"
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
rhai = { version = "1.19.0", features = ["serde", "wasm-bindgen"] }

[target.'cfg(not(all(target_family = "wasm", any(target_os = "unknown", target_os = "none"))))'.dependencies]
rhai = { version = "1.19.0", features = ["serde"] }

[lints]
workspace = true
