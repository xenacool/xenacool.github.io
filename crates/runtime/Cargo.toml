[package]
name = "pystral_runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
pystral_core = { path = "../core" }
pystral_compiler = { path = "../compiler" }
serde = { version = "1.0", features = ["derive"] }
glam = { version = "0.30", features = ["serde"] }
hexx = { version = "0.24.0", features = ["grid", "serde", "mesh"] }
wasm-bindgen = "0.2"

[lints]
workspace = true
