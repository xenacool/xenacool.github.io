[package]
name = "pystral_gate"
version = "0.1.0"
edition = "2024"

[dependencies]
pystral_core = { path = "../core" }
pystral_compiler = { path = "../compiler" }
wasm-bindgen = "0.2.126"
js-sys = "0.3"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
hexx = { version = "0.24.0", features = ["grid", "serde", "mesh"] }
tiny-skia = "0.12.0"
tween = "2.2.0"
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-worker = { version = "0.6.0", features = ["futures"] }
lazy_static = "1.4"
wasm-bindgen-futures = "0.4"
futures = "0.3"
gloo-timers = { version = "0.3.0", features = ["futures"] }
parry3d = "0.30.0"

[dev-dependencies]
proptest = "1.0"

[dependencies.web-sys]
version = "0.3"
features = ["Window", "Document", "HtmlCanvasElement", "HtmlElement", "CssStyleDeclaration", "CanvasRenderingContext2d", "WebGlRenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlUniformLocation", "WebGlTexture", "Performance", "DedicatedWorkerGlobalScope", "console"]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }
