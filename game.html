<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./web/favicon.ico" type="image/x-icon">
    <title>Pystral Gate — pg_rpg</title>
    <script src="web/enable-threads.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; color: white; font-family: sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        input[type=range] { width: 300px; }
        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }
        button {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            cursor: pointer;
            background: #444;
            color: white;
            border: 1px solid #666;
            border-radius: 4px;
        }
        button:hover { background: #555; }
        svg { width: 16px; height: 16px; }
        .play-icon, .pause-icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        #entity-viewer {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 250px;
            max-height: 80vh;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            border: 1px solid #444;
            display: none;
            pointer-events: auto;
            z-index: 100;
        }
        #history-viewer {
            position: absolute;
            top: 10px;
            right: 320px;
            width: 250px;
            max-height: 80vh;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.8);
            color: #00ccff;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            border: 1px solid #444;
            display: none;
            pointer-events: auto;
            z-index: 100;
        }
        #heartbeat-panel {
            position: absolute;
            top: 10px;
            right: 590px;
            width: 220px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffcc00;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            border: 1px solid #665500;
            display: none;
            pointer-events: auto;
            z-index: 100;
        }
        .history-entry {
            padding: 2px 4px;
            cursor: pointer;
            border-bottom: 1px solid #222;
        }
        .history-entry:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .history-entry.current {
            background: rgba(0, 204, 255, 0.3);
            font-weight: bold;
        }
        #hud-dock {
            position: fixed;
            left: 8px;
            right: 8px;
            bottom: 8px;
            z-index: 150;
            display: grid;
            grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr) minmax(260px, 1fr);
            grid-template-areas: "controls actions context";
            gap: 8px;
            align-items: end;
            max-height: 42vh;
            pointer-events: none;
        }
        #hud-dock > * { pointer-events: auto; }
        #hud-dock > * { min-width: 0; }
        #hud-dock #ui { grid-area: controls; position: static; transform: none; max-height: 38vh; overflow-y: auto; }
        #hud-dock #action-stack {
            position: fixed !important;
            left: 50% !important;
            bottom: 52px !important;
            top: auto !important;
            right: auto !important;
            transform: translateX(-50%) !important;
            width: min(420px, calc(33vw - 16px));
            max-width: 420px;
            max-height: 38vh;
            overflow-y: auto;
            z-index: 160;
        }
        #hud-dock #action-log-panel { grid-area: context; position: static !important; width: auto !important; max-width: none !important; max-height: 38vh; }
        #hud-dock #diagnostics-panel,
        #hud-dock #entity-viewer,
        #hud-dock #history-viewer,
        #hud-dock #heartbeat-panel {
            position: static !important;
            inset: auto !important;
            width: auto !important;
            max-height: 38vh;
            overflow-y: auto;
        }
        /* The dock owns transient panel placement.  This also neutralizes the
           legacy inline coordinates on panels that used to float independently
           over the canvas. */
        #hud-dock #action-stack,
        #hud-dock #action-log-panel,
        #hud-dock #diagnostics-panel,
        #hud-dock #entity-viewer,
        #hud-dock #history-viewer,
        #hud-dock #heartbeat-panel { top: auto !important; right: auto !important; bottom: auto !important; left: auto !important; transform: none !important; }
        #hud-dock #action-log-panel,
        #hud-dock #history-viewer,
        #hud-dock #diagnostics-panel,
        #hud-dock #heartbeat-panel,
        #hud-dock #entity-viewer { display: none !important; }
        #hud-dock #action-stack {
            position: fixed !important;
            left: 50% !important;
            right: auto !important;
            top: auto !important;
            bottom: 52px !important;
            transform: translateX(-50%) !important;
        }
        #hud-dock[data-hud-mode="play"] #action-log-panel,
        #hud-dock[data-hud-mode="actions"] #action-stack,
        #hud-dock[data-hud-mode="unit-state"] #action-stack,
        #hud-dock[data-hud-mode="history"] #history-viewer,
        #hud-dock[data-hud-mode="diagnostics"] #diagnostics-panel { display: block !important; }
        #hud-dock[data-hud-mode="diagnostics"] #heartbeat-panel { display: none !important; }
        #hud-dock #diagnostics-panel { max-height: 18vh !important; min-width: 0; }
        #hud-dock[data-hud-mode="actions"] #action-stack,
        #hud-dock[data-hud-mode="unit-state"] #action-stack { display: flex !important; }
        #hud-dock[data-hud-mode="actions"] #action-menu,
        #hud-dock[data-hud-mode="unit-state"] #unit-state-panel { display: block !important; }
        #hud-mode-bar { grid-column: 1 / -1; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
        #hud-mode-bar button[aria-current="true"] { background: #1d6fa5; outline: 2px solid #8ecae6; }
        .hud-context-panel { min-height: 0; }
        @media (max-width: 1024px) and (orientation: portrait), (max-width: 760px) {
            nav[aria-label="Pystral Gate sections"] { top: 48px !important; z-index: 140 !important; }
            body { overflow: hidden; }
            #hud-dock { left: 4px; right: 4px; bottom: 4px; display: flex; flex-direction: column; align-items: stretch; max-height: 46vh; }
            #hud-dock .hud-context-panel { display: none !important; }
            #hud-dock[data-hud-mode="actions"] #action-stack,
            #hud-dock[data-hud-mode="unit-state"] #action-stack,
            #hud-dock[data-hud-mode="unit-state"] #unit-state-panel,
            #hud-dock[data-hud-mode="history"] #history-viewer,
            #hud-dock[data-hud-mode="diagnostics"] #diagnostics-panel,
            #hud-dock[data-hud-mode="diagnostics"] #heartbeat-panel,
            #hud-dock[data-hud-mode="play"] #action-log-panel { display: block !important; }
            #hud-dock[data-hud-mode="actions"] #action-stack { display: flex !important; }
            #hud-dock #ui { order: 3; max-height: 22vh; }
            #hud-dock #action-stack { order: 2; max-height: 30vh; }
            #hud-dock #action-log-panel { order: 2; }
            #hud-dock #entity-viewer { display: none !important; }
            #hud-dock button, #hud-dock input { min-height: 32px; }
        }
        /* Compact perimeter mode: keep phone HUD footprints bounded so panels
           cannot push content below the fold or cover the scene. */
        @media (max-width: 1024px) and (orientation: portrait), (max-width: 760px) {
            #hud-dock {
                inset: 0;
                width: auto;
                height: 100vh;
                max-height: none;
                display: block;
                pointer-events: none;
            }
            #hud-mode-bar {
                position: absolute;
                top: max(8px, env(safe-area-inset-top));
                left: 8px;
                right: 8px;
                display: flex;
                justify-content: space-between;
                gap: 6px;
                pointer-events: auto;
            }
            #hud-mode-bar button {
                width: 36px;
                height: 36px;
                min-height: 36px;
                padding: 0;
                border-radius: 50%;
                justify-content: center;
                font-size: 0;
                opacity: 0.78;
            }
            #hud-mode-bar button::before { font-size: 16px; }
            #hud-mode-bar button[data-hud-mode="play"]::before { content: '▶'; }
            #hud-mode-bar button[data-hud-mode="actions"]::before { content: '✦'; }
            #hud-mode-bar button[data-hud-mode="unit-state"]::before { content: '♙'; }
            #hud-mode-bar button[data-hud-mode="history"]::before { content: '↶'; }
            #hud-mode-bar button[data-hud-mode="diagnostics"]::before { content: '!'; }
            #hud-mode-bar #history-download-context {
                position: absolute;
                top: 44px;
                right: 0;
                width: 30px;
                height: 30px;
                min-height: 30px;
            }
            #hud-mode-bar #history-download-context::before { content: '⇩'; font-size: 15px; }
            #hud-dock #ui {
                position: absolute !important;
                left: 50%;
                bottom: max(4px, env(safe-area-inset-bottom));
                transform: translateX(-50%);
                width: min(78vw, 300px);
                max-height: 16vh;
                overflow: visible;
                padding: 4px 6px;
                gap: 2px;
                border-radius: 8px;
                opacity: 0.94;
            }
            #hud-dock #ui .controls-row { gap: 4px; margin-bottom: 2px; flex-wrap: wrap; justify-content: center; }
            #hud-dock #ui input[type=range] { width: min(42vw, 150px); }
            #hud-dock #ui button { min-height: 26px; padding: 3px 6px; }
            #hud-dock[data-hud-mode="play"] #playback-controls,
            #hud-dock[data-hud-mode="actions"] #playback-controls,
            #hud-dock[data-hud-mode="unit-state"] #playback-controls { display: none; }
            #hud-dock[data-hud-mode="history"] #playback-controls,
            #hud-dock[data-hud-mode="diagnostics"] #playback-controls { display: flex; }
            #hud-dock #action-stack,
            #hud-dock #action-log-panel,
            #hud-dock #history-viewer,
            #hud-dock #diagnostics-panel,
            #hud-dock #heartbeat-panel,
            #hud-dock #unit-state-panel,
            #hud-dock #action-menu { display: none !important; }
            #hud-dock[data-hud-mode="play"] #action-log-panel,
            #hud-dock[data-hud-mode="history"] #history-viewer,
            #hud-dock[data-hud-mode="diagnostics"] #diagnostics-panel { display: block !important; }
            /* Heartbeat is represented in diagnostics on compact screens so
               two independently sized panels cannot consume the same slot. */
            #hud-dock[data-hud-mode="diagnostics"] #heartbeat-panel { display: none !important; }
            #hud-dock[data-hud-mode="actions"] #action-stack,
            #hud-dock[data-hud-mode="unit-state"] #action-stack { display: flex !important; }
            #hud-dock[data-hud-mode="actions"] #action-menu,
            #hud-dock[data-hud-mode="unit-state"] #unit-state-panel { display: block !important; }
            #hud-dock[data-hud-mode="unit-state"] #action-menu { display: none !important; }
            #hud-dock .hud-context-panel,
            #hud-dock #action-stack,
            #hud-dock #history-viewer,
            #hud-dock #action-log-panel,
            #hud-dock #diagnostics-panel,
            #hud-dock #heartbeat-panel {
                position: absolute !important;
                left: 50% !important;
                right: auto !important;
                top: auto !important;
                bottom: 15vh !important;
                transform: translateX(-50%);
                width: min(78vw, 300px);
                max-width: 78vw;
                max-height: 18vh;
                min-height: 0;
                overflow-y: auto;
                box-sizing: border-box;
                padding: 6px;
                border-radius: 8px;
                pointer-events: auto;
            }
            #hud-dock #action-log-panel,
            #hud-dock #history-viewer,
            #hud-dock #diagnostics-panel,
            #hud-dock #heartbeat-panel,
            #hud-dock #action-stack { transform: translateX(-50%) !important; }
            #hud-dock #action-stack { gap: 4px; }
            #hud-dock #diagnostics-panel,
            #hud-dock #heartbeat-panel { bottom: 15vh; max-height: 10vh; }
            #hud-dock #heartbeat-panel { bottom: 26vh; }
            #hud-dock #history-viewer .history-entry { padding: 1px 3px; }
            #hud-dock #entity-viewer { display: none !important; }
        }
        @media (max-width: 400px) {
            #hud-mode-bar { left: 4px; right: 4px; gap: 3px; }
            #hud-mode-bar button { width: 32px; height: 32px; min-height: 32px; }
            #hud-mode-bar button::before { font-size: 14px; }
            #hud-dock #ui { width: 82vw; max-height: 16vh; }
            #hud-dock .hud-context-panel,
            #hud-dock #action-stack { width: 82vw; max-width: 82vw; max-height: 17vh; }
        }
    </style>
</head>
<body>
<nav aria-label="Pystral Gate sections" style="position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:200;background:#101b2dcc;padding:6px 10px;border:1px solid #31415e;border-radius:5px;font:12px sans-serif;">
    <a href="index.html" style="color:#cfe2ff;">Home</a> · <a href="editor.html" style="color:#cfe2ff;">Author Rhai</a>
</nav>
<canvas id="canvas"></canvas>
<div id="entity-viewer"></div>
<div id="history-viewer"></div>
<section id="heartbeat-panel" aria-label="Worker heartbeat">
    <strong>Worker heartbeat</strong>
    <div id="heartbeat-message" role="status" aria-live="polite">No heartbeat received.</div>
    <div id="heartbeat-reason" role="status" aria-live="polite">Waiting for first probe response.</div>
</section>
<div id="hud-dock" data-hud-mode="play">
<div id="hud-mode-bar" role="toolbar" aria-label="Game Boy HUD modes">
    <button type="button" data-hud-mode="play" aria-current="true">Play</button>
    <button type="button" data-hud-mode="actions" aria-current="false">Actions</button>
    <button type="button" data-hud-mode="unit-state" aria-current="false">Unit State</button>
    <button type="button" data-hud-mode="history" aria-current="false">History</button>
    <button type="button" data-hud-mode="diagnostics" aria-current="false">Diagnostics</button>
    <button type="button" id="history-download-context" title="Download replay history">Download History</button>
</div>
<div id="ui">
    <div class="controls-row" id="playback-controls">
        <label for="history-slider">History Log:</label>
        <input type="range" id="history-slider" min="0" max="320" value="0">
        <span id="slider-value">0</span>
    </div>
    <div class="controls-row">
        <button id="play-log" title="Play/Pause Log Scrubbing">
            <svg class="play-icon" viewBox="0 0 24 24">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg class="pause-icon" viewBox="0 0 24 24" style="display:none;">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            Log
        </button>
        <button id="play-sim" title="Play/Pause Simulation (Animations & Camera)">
            <svg class="play-icon" viewBox="0 0 24 24">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg class="pause-icon" viewBox="0 0 24 24" style="display:none;">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            Sim
        </button>
        <div style="margin-left: 10px; display: flex; align-items: center; gap: 5px;">
            <input type="checkbox" id="debug-checkbox">
            <label for="debug-checkbox" style="font-size: 12px; cursor: pointer;">Debug</label>
        </div>
        <div id="history-step-control" style="margin-left: 10px; display: none; align-items: center; gap: 5px;">
            <label for="history-step-ms" style="font-size: 12px;">Step ms</label>
            <input id="history-step-ms" type="number" min="1" max="10000" step="1" value="100" style="width: 65px;">
        </div>
        <div style="margin-left: 10px; display: flex; align-items: center; gap: 5px;">
            <span id="error-display" style="font-size: 12px; cursor: pointer; color: white;">Error: 0</span>
        </div>
    </div>
    <div class="controls-row">
        <button id="nav-up" title="Camera Up">Up</button>
        <button id="nav-down" title="Camera Down">Down</button>
        <button id="nav-left" title="Camera Left">Left</button>
        <button id="nav-right" title="Camera Right">Right</button>
    </div>
    <div class="controls-row" id="action-controls" style="display: none; background: rgba(0, 100, 200, 0.3); padding: 5px; border-radius: 5px;">
        <button id="action-up">▲</button>
        <button id="action-down">▼</button>
        <button id="action-left">◀</button>
        <button id="action-right">▶</button>
        <button id="action-layer-up" title="Game layer up">Layer ▲</button>
        <button id="action-layer-down" title="Game layer down">Layer ▼</button>
        <button id="action-confirm" style="background: #228b22;">Action</button>
        <button id="action-wait" style="background: #6a5acd;">Wait</button>
        <button id="action-return" style="background: #b22222;">Return</button>
        <button id="test-occupy-destination" style="display: none;">Occupy selected destination</button>
    </div>
</div>
<div id="action-stack" style="display: none; position: absolute; left: 16px; bottom: 92px; max-width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 110px); flex-direction: column; align-items: stretch; gap: 8px;">
<section id="unit-state-panel" class="hud-context-panel" aria-label="UnitState information" style="display: none; overflow-y: auto; max-height: 42vh; padding: 10px; border: 1px solid rgba(255,255,255,0.45); border-radius: 6px; background: rgba(8, 14, 28, 0.94); color: white; font: 12px monospace;">
    <strong>UnitState</strong>
    <div id="unit-state-items"></div>
</section>
<section id="action-menu" class="hud-context-panel" role="region" aria-labelledby="action-menu-heading" aria-describedby="action-menu-status" style="display: none; min-width: 240px; max-width: 340px; max-height: 42vh; overflow-y: auto; padding: 10px; border: 1px solid rgba(255,255,255,0.45); border-radius: 6px; background: rgba(8, 14, 28, 0.9); color: white; font: 14px monospace;">
    <h2 id="action-menu-heading" tabindex="-1" style="font-size: 14px; margin: 0 0 6px;">Action menu</h2>
    <div id="action-menu-status" role="status" aria-live="polite"></div>
    <div id="action-menu-items"></div>
</section>
<div id="game-completed" role="status" aria-live="assertive" data-outcome="" hidden></div>
</div>
<section id="action-log-panel" class="hud-context-panel" aria-label="Action log" style="position: absolute; left: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px)); max-height: 24vh; overflow-y: auto; padding: 8px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.35); border-radius: 6px; background: rgba(8, 14, 28, 0.86); color: white; font: 12px monospace;">
    <strong>Action log</strong>
    <ol id="action-log" style="margin: 5px 0 0; padding-left: 22px;"></ol>
</section>
<section id="diagnostics-panel" aria-label="Diagnostics" style="position: absolute; top: 10px; right: 10px; width: 340px; max-height: 70vh; overflow-y: auto; background: rgba(0,0,0,0.78); font-size: 11px; padding: 8px; color: #ffcc00; font-family: monospace; z-index: 110;">
    <strong>UI log</strong>
    <pre id="log-container" aria-label="UI log" style="max-height: 260px; overflow-y: auto; white-space: pre-wrap; margin: 5px 0;"></pre>
    <textarea id="log-copy" aria-label="Copyable UI log" readonly style="width: 100%; height: 110px; box-sizing: border-box; color: white; background: #111; font: 11px monospace;">No UI log messages.</textarea>
    <div style="display: flex; gap: 5px; margin-top: 5px;">
        <button id="copy-ui-log" type="button">Copy UI log</button>
        <button id="download-ui-log" type="button">Download UI log</button>
        <button id="download-history" type="button">Download history</button>
    </div>
    <div id="diagnostics-download-status" aria-live="polite" style="margin-top: 5px; color: #aaa;"></div>
</section>
</div>
<script type="module">
    import init, { run_app } from './web/pystral_gate.js';

    const hudDock = document.getElementById('hud-dock');
    ['entity-viewer', 'history-viewer', 'heartbeat-panel', 'diagnostics-panel']
        .forEach((id) => {
            const panel = document.getElementById(id);
            panel.classList.add('hud-context-panel');
            hudDock.appendChild(panel);
        });
    // Keep all transient panels inside one layout owner.

    const hudModes = ['play', 'actions', 'unit-state', 'history', 'diagnostics'];
    window.setHudMode = (mode) => {
        const next = hudModes.includes(mode) ? mode : 'play';
        hudDock.dataset.hudMode = next;
        document.querySelectorAll('[data-hud-mode]').forEach((button) => {
            if (button.tagName === 'BUTTON') {
                button.setAttribute('aria-current', button.dataset.hudMode === next ? 'true' : 'false');
            }
        });
        const active = document.querySelector(`[data-hud-mode="${next}"]`);
        if (active?.tagName === 'BUTTON') active.focus({ preventScroll: true });
    };
    document.querySelectorAll('#hud-mode-bar [data-hud-mode]').forEach((button) => {
        button.addEventListener('click', () => window.setHudMode(button.dataset.hudMode));
    });
    document.getElementById('history-download-context').addEventListener('click', () => {
        document.getElementById('download-history').click();
    });
    const panelFocusables = (panel) => [...panel.querySelectorAll('button, [tabindex="0"], .history-entry')];
    const movePanelFocus = (direction) => {
        const panelIds = {
            play: 'action-log-panel',
            actions: 'action-menu',
            'unit-state': 'unit-state-panel',
            history: 'history-viewer',
            diagnostics: 'diagnostics-panel',
        };
        const activePanel = document.getElementById(panelIds[hudDock.dataset.hudMode]);
        if (!activePanel) return false;
        const focusables = panelFocusables(activePanel);
        if (!focusables.length) {
            activePanel.scrollBy({ top: direction * 48, behavior: 'smooth' });
            return true;
        }
        const current = focusables.indexOf(document.activeElement);
        const next = Math.max(0, Math.min(focusables.length - 1, current + direction));
        focusables[next].focus();
        focusables[next].scrollIntoView({ block: 'nearest' });
        return true;
    };
    document.addEventListener('keydown', (event) => {
        if (event.target.matches('input, textarea, select')) return;
        if (event.key === 'ArrowDown' && ['unit-state', 'history', 'diagnostics'].includes(hudDock.dataset.hudMode)) {
            if (movePanelFocus(1)) event.preventDefault();
        }
        if (event.key === 'ArrowUp' && ['unit-state', 'history', 'diagnostics'].includes(hudDock.dataset.hudMode)) {
            if (movePanelFocus(-1)) event.preventDefault();
        }
        if (event.key === 'F1') { event.preventDefault(); window.setHudMode('play'); }
        if (event.key === 'F2') { event.preventDefault(); window.setHudMode('actions'); }
        if (event.key === 'F3') { event.preventDefault(); window.setHudMode('unit-state'); }
        if (event.key === 'F4') { event.preventDefault(); window.setHudMode('history'); }
        if (event.key === 'F5') { event.preventDefault(); window.setHudMode('diagnostics'); }
        if (event.key === 'Escape') window.setHudMode('play');
    });

    // Standard Game Boy-style mapping: D-pad navigates, A selects, B backs
    // out, and Start cycles the contextual HUD modes. Keyboard navigation
    // remains the test oracle and this adapter only emits the same actions.
    const gamepadButtons = new Map();
    let lastGamepadAxisX = 0;
    let lastGamepadAxisY = 0;
    const gamepadEdges = (gamepad) => {
        const pressed = (index) => Boolean(gamepad.buttons[index]?.pressed);
        const rising = (index) => {
            const now = pressed(index);
            const was = gamepadButtons.get(index) || false;
            gamepadButtons.set(index, now);
            return now && !was;
        };
        return { pressed, rising };
    };
    const pollGamepad = () => {
        const gamepad = navigator.getGamepads?.().find(Boolean);
        if (gamepad) {
            const { rising } = gamepadEdges(gamepad);
            const axisX = gamepad.axes[0] || 0;
            const axisY = gamepad.axes[1] || 0;
            const up = axisY < -0.7 && lastGamepadAxisY >= -0.7;
            const down = axisY > 0.7 && lastGamepadAxisY <= 0.7;
            const left = axisX < -0.7 && lastGamepadAxisX >= -0.7;
            const right = axisX > 0.7 && lastGamepadAxisX <= 0.7;
            lastGamepadAxisX = axisX;
            lastGamepadAxisY = axisY;
            if (rising(12) || up) window.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp' }));
            if (rising(13) || down) window.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown' }));
            if (rising(14) || left) window.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft' }));
            if (rising(15) || right) window.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight' }));
            if (rising(0)) document.activeElement?.click?.();
            if (rising(1)) window.setHudMode('play');
            if (rising(9)) {
                const index = hudModes.indexOf(hudDock.dataset.hudMode);
                window.setHudMode(hudModes[(index + 1) % hudModes.length]);
            }
        }
        requestAnimationFrame(pollGamepad);
    };

        } else {
            delete menu.dataset.targetSessionId;

        }
        window.previewActive = Boolean(state.preview);
        menu.dataset.gameCompleted = state.game_completed ? 'true' : 'false';
        const outcome = state.completion_outcome;
        // serde_wasm_bindgen represents unit-like Rust enum variants as their
        // numeric discriminant, while data-bearing variants are keyed
        // objects. Normalize both forms at the DOM boundary so the semantic
        // completion contract is stable for Draw as well as Victory/Defeat.
        const serializedOutcomeName = outcome ? (Object.keys(outcome)[0] || '') : '';
        const outcomeName = outcome === false
            ? 'Draw'
            : typeof outcome === 'string'
            ? (['Victory', 'Defeat', 'Draw'].includes(outcome)
                ? outcome
                : (Number(outcome) === 0 ? 'Draw' : ''))
            : typeof outcome === 'number'
            ? (outcome === 0 ? 'Draw' : '')
            : (serializedOutcomeName === '0' ? 'Draw' : serializedOutcomeName);
        completion.hidden = !state.game_completed;
        completion.dataset.outcome = outcomeName;
        completion.textContent = state.game_completed ? `${outcomeName} — Game completed.` : '';
        if (state.action_feedback) {
            window.pendingActionFeedback = state.action_feedback;

            window.pendingActionFeedback = '';
        }
        unitStateItems.replaceChildren();
        unitStateItems.setAttribute('role', 'tree');
        (state.unit_states || []).forEach(({ unit_id, state: unit }) => {

        stack.style.display = (state.unit_states || []).length || state.available_actions ? 'flex' : 'none';
        menu.dataset.actionPending = state.action_pending ? 'true' : 'false';
        menu.dataset.animationPending = state.action_pending ? 'true' : 'false';
        menu.dataset.waitPending = state.wait_pending ? 'true' : 'false';
        if (!window.previewActive && !state.action_pending && !state.wait_pending) {
            window.previewLocation = '';

        if (!actions) {
            menu.style.display = state.game_completed ? 'block' : 'none';

        document.getElementById('action-menu-heading').textContent = `Unit ${actions.unit_id} action menu`;

        const addEntry = (label, depth, detail = '', command = null, key = '', selected = false) => {
            const row = command ? document.createElement('button') : document.createElement('div');
            row.textContent = `${'  '.repeat(depth)}${label}${detail ? ` — ${detail}` : ''}`;
            row.style.cssText = `display:block;width:100%;text-align:left;color:${depth === 0 ? '#8ecae6' : '#e0e0e0'};background:${selected ? 'rgba(40,120,180,0.45)' : 'transparent'};border:0;padding:3px;font:inherit;cursor:${command ? 'pointer' : 'default'};`;

        const selectedJob = selectedPath.find(path => path.startsWith('job:')) || '';
        const selectedAbility = selectedPath.find(path => path.startsWith('ability:')) || '';
        addEntry('Move', 0, `${actions.movement.length} reachable`, 'confirm', 'move', false);
        const renderJob = (job, descriptor) => {
            const selected = selectedJob === `job:${descriptor}`;
            const affordance = selected ? '▾' : '▸';
            addEntry(`${affordance} ${job.name}`, 0, `${job.abilities.length} abilities — press Enter to ${selected ? 'close' : 'open'}`, `menu-job:${descriptor}`, `job:${descriptor}`, selected);
            const row = items.querySelector(`[data-menu-key="job:${descriptor}"]`);
            if (row) {
                row.setAttribute('aria-haspopup', 'true');
                row.setAttribute('aria-expanded', selected ? 'true' : 'false');
                row.setAttribute('aria-label', `${job.name}, ${job.abilities.length} abilities, ${selected ? 'expanded' : 'collapsed'}; press Enter to ${selected ? 'close' : 'open'}`);
            }
            if (selected && !state.ability_targets) {
                job.abilities.forEach(ability => addEntry(
                    ability.name,

                    `id ${ability.id}`,
                    `menu-ability:${ability.id}`,
                    `ability:${ability.id}`,

        renderJob(actions.primary_job, 'primary');

        const targetMenu = state.ability_targets;

        if (!state.action_pending && !state.wait_pending) {
            let focusKey = 'heading';
            if (targetMenu) focusKey = `target:${targetMenu.selected_index}`;

    window.__pystralDebugTraces = [];

        const acceptedPrefix = 'unified worker accepted action input ';
        if (message.startsWith(acceptedPrefix)) {
            window.__pystralAcceptedActionCounts[message.slice(acceptedPrefix.length)] =
                (window.__pystralAcceptedActionCounts[message.slice(acceptedPrefix.length)] || 0) + 1;

    // Latest worker-output sequence observed by the main-thread replica.  This

    window.__pystralWorkerLatestSeq = 0;
    window.update_worker_heartbeat = (latestSeq, latestInputSeq, status) => {
        const seq = Number(latestSeq);
        window.__pystralWorkerLatestSeq = Math.max(window.__pystralWorkerLatestSeq, seq);
        window.__pystralWorkerLatestInputSeq = Math.max(
            window.__pystralWorkerLatestInputSeq,
            Number(latestInputSeq),
        );
        window.__pystralWorkerStatus = status;
        window.__pystralHeartbeatReceivedAt = Date.now();
        document.getElementById('heartbeat-reason').textContent =
            `Worker responsive · ${status} · input seq ${window.__pystralWorkerLatestInputSeq}`;
    };

    // Heartbeats can arrive in bursts while the worker drains its queue. Keep
    // the debug panel readable by publishing only the latest one once per
    // second; the protocol still receives every heartbeat immediately.
    window.__pystralHeartbeatReceivedAt = 0;
    window.__pystralWorkerLatestInputSeq = 0;
    window.__pystralWorkerStatus = 'Unknown';
    window.setInterval(() => {
        const receivedAt = window.__pystralHeartbeatReceivedAt;
        if (!receivedAt) return;
        const age = Math.max(0, Math.round((Date.now() - receivedAt) / 1000));
        document.getElementById('heartbeat-message').textContent =
            `latest output seq: ${window.__pystralWorkerLatestSeq} · ${age}s ago`;
        if (age >= 2) {
            document.getElementById('heartbeat-reason').textContent =
                `No probe response for ${age}s · last state ${window.__pystralWorkerStatus}`;
        } else {
            document.getElementById('heartbeat-reason').textContent =
                `Worker responsive · ${window.__pystralWorkerStatus} · input seq ${window.__pystralWorkerLatestInputSeq}`;

        anchor.download = filename;
        document.body.appendChild(anchor);

        setTimeout(() => URL.revokeObjectURL(url), 0);

    async function run() {
        console.log('Main thread starting run()...');
        
        try {
            await init({ module_or_path: 'web/pystral_gate_bg.wasm' });
            window.app = await run_app();
        } catch (err) {
            console.error('Main thread initialization failed:', err);
            return;
        }

        const app = window.app;

        const slider = document.getElementById('history-slider');
        const valueDisplay = document.getElementById('slider-value');
        
        slider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            valueDisplay.textContent = val;
            app.set_history_index(val);
        });

        const setupToggle = (btnId, toggleFn, autostart = false) => {
            const btn = document.getElementById(btnId);
            const playIcon = btn.querySelector('.play-icon');
            const pauseIcon = btn.querySelector('.pause-icon');
            let playing = autostart;
            
            if (playing) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            }

            btn.addEventListener('click', () => {
                playing = !playing;
                toggleFn();
                playIcon.style.display = playing ? 'none' : 'block';
                pauseIcon.style.display = playing ? 'block' : 'none';
            });
        };

        setupToggle('play-log', () => app.toggle_play_log(), true);
        setupToggle('play-sim', () => app.toggle_play_animations(), true);

        document.getElementById('nav-up').addEventListener('click', () => app.camera_nav('up'));
        document.getElementById('nav-down').addEventListener('click', () => app.camera_nav('down'));
        document.getElementById('nav-left').addEventListener('click', () => app.camera_nav('left'));
        document.getElementById('nav-right').addEventListener('click', () => app.camera_nav('right'));

        document.getElementById('action-up').addEventListener('click', () => window.sendActionInput('up'));
        document.getElementById('action-down').addEventListener('click', () => window.sendActionInput('down'));
        document.getElementById('action-left').addEventListener('click', () => window.sendActionInput('left'));
        document.getElementById('action-right').addEventListener('click', () => window.sendActionInput('right'));
        document.getElementById('action-layer-up').addEventListener('click', () => window.sendActionInput('layer-up'));
        document.getElementById('action-layer-down').addEventListener('click', () => window.sendActionInput('layer-down'));
        document.getElementById('action-confirm').addEventListener('click', () => window.sendActionInput('confirm'));
        document.getElementById('action-wait').addEventListener('click', () => window.sendActionInput('wait'));
        document.getElementById('action-return').addEventListener('click', () => window.sendActionInput('return'));

        const testOccupy = document.getElementById('test-occupy-destination');
        if (new URLSearchParams(window.location.search).has('test')) {
            testOccupy.style.display = 'block';
            testOccupy.addEventListener('click', () => app.action_nav('test-occupy'));
        }

        const debugCheckbox = document.getElementById('debug-checkbox');
        debugCheckbox.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            app.set_debug_mode(isChecked);
            document.getElementById('entity-viewer').style.display = isChecked ? 'block' : 'none';
            document.getElementById('history-viewer').style.display = isChecked ? 'block' : 'none';
            window.set_debug_panels_visible(isChecked);
            document.getElementById('history-step-control').style.display = isChecked ? 'flex' : 'none';
        });

        document.getElementById('history-step-ms').addEventListener('change', (e) => {
            app.set_history_step_ms(Number(e.target.value));
        });
        
        let errorMode = false;
        const errorDisplay = document.getElementById('error-display');
        errorDisplay.addEventListener('click', () => {
            errorMode = !errorMode;
            app.set_broken_mode(errorMode);
            if (errorMode) {
                errorDisplay.style.border = "1px solid red";
            } else {
                errorDisplay.style.border = "none";
            }
        });
    }
    run().catch(console.error);
</script>
</body>
</html>
