<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bevy Demo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }
    canvas#bevy-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <canvas id="bevy-canvas"></canvas>
  <script type="module">
    import init from './wasm_runner.js';
    async function main() {
      await init();
      document.getElementById('loading').remove();
    }
    main().catch(err => {
      document.getElementById('loading').textContent = 'Error: ' + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
