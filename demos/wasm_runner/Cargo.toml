[package]
name = "wasm_runner"
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "bevy_render", "bevy_pbr", "bevy_sprite", "bevy_sprite_render",
    "bevy_text", "bevy_ui", "bevy_log", "bevy_asset", "bevy_winit",
    "bevy_core_pipeline", "bevy_gizmos", "default_font",
    "tonemapping_luts", "png", "webgl2", "ktx2", "zstd_rust"
] }
bevy_gradmesh = { path = "../../libs/bevy_gradmesh" }
bevy_composable_dragging = { path = "../../libs/bevy_composable_dragging", features = ["shapes-3d"] }
avian2d = { version = "0.8", default-features = false, features = ["2d", "parry-f32", "parallel"] }
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "collider-from-mesh", "parallel"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location"] }

[patch.crates-io]
bevy_gradmesh = { path = "../../libs/bevy_gradmesh" }
